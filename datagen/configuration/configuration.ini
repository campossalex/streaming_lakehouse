[KAFKA]
# redpanda:9092 is the internal listener on the compose network (docker-compose.yml).
# From the host, use localhost:19092 instead.
bootstrap_servers = redpanda:9092
topic_orders      = orders_log

[GENERATOR]
# inter-event delay range in milliseconds
min_freq_ms      = 50
max_freq_ms      = 200

# number of orders in the simulated pool (concurrently in flight)
num_orders       = 200

# probability an order is cancelled instead of advancing (checked from PLACED/PAID only)
cancel_chance    = 0.05
