# Trino's Iceberg catalog, talking to Lakekeeper over the Iceberg REST protocol.
# The file name is the catalog name, so the tables Fluss tiers are addressed as
# warehouse.orders.orders_enriched — the Fluss database `orders` becomes the Iceberg
# namespace `orders`, and the Lakekeeper warehouse is also called `warehouse`.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=warehouse

# Lakekeeper is configured with sts-enabled=false (lakekeeper/create-warehouse.json), so
# it vends no temporary credentials: every engine — Trino here, Fluss and Flink in
# docker-compose.yml — brings its own static S3 keys for MinIO.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
s3.region=us-east-1
